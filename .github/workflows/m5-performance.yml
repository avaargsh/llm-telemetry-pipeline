name: m5-performance-baseline
on:
  pull_request:
  workflow_dispatch:
jobs:
  perf-correctness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: M5 deterministic reporting and SLO contract unit tests
        run: python3 -m unittest discover -s scripts -p 'test_m5_benchmark.py' -v
      - name: Isolated real Kafka / PG / CH correctness profile (not an SLO pass)
        env:
          M5_COUNT: "128"
          M5_CONCURRENCY: "4"
          M5_PARTITIONS: "6"
          M5_BATCH_SIZE: "32"
          M5_VISIBILITY_TIMEOUT: "90"
          M5_OUTPUT: artifacts/m5-performance.json
        run: bash scripts/m5-performance-smoke.sh
      - name: Archive raw performance and resource measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-performance-baseline-report
          path: artifacts/m5-performance.json
          if-no-files-found: warn
          retention-days: 14
