name: m2-durable-dlq-smoke
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  dlq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Kafka poison message and ClickHouse valid event
        run: bash scripts/m2-dlq-smoke.sh
