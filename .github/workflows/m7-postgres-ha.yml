name: m7-postgres-physical-ha-fault
on:
  pull_request:
  workflow_dispatch:
jobs:
  postgres-physical-standby-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: PostgreSQL 17 physical standby, confirmed commit and crash-window fault
        env:
          M7_PGHA_EVIDENCE_PATH: artifacts/m7-pgha-failover.json
        run: bash scripts/m7-pgha-failover-smoke.sh
      - name: Archive fail-closed HA ledger/outbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-postgres-ha-failover-evidence
          path: artifacts/m7-pgha-failover.json
          if-no-files-found: error
          retention-days: 14
