name: m3b-three-broker-kraft-ha
on:
  pull_request:
  workflow_dispatch:
jobs:
  broker-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Real three-broker KRaft failure matrix
        env:
          M3B_HA_REPORT_PATH: /tmp/m3b-kafka-ha-report.json
        run: bash scripts/m3b-ha-smoke.sh
      - name: Upload Kafka broker HA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-kafka-ha-report
          path: /tmp/m3b-kafka-ha-report.json
          if-no-files-found: ignore
          retention-days: 14
