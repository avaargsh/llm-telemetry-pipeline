name: m5b-outbox-ack-crash-window
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-kafka-postgres-crash-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Verify Kafka ACK / Relay crash / lease re-claim with real dependencies
        env:
          M5B_EVIDENCE_PATH: artifacts/m5b-outbox-crash-window.json
        run: bash scripts/m5b-relay-ack-crash-smoke.sh
      - name: Archive transaction/lease/physical-duplicate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5b-outbox-ack-crash-evidence
          path: artifacts/m5b-outbox-crash-window.json
          if-no-files-found: error
          retention-days: 14
