name: m3b-kafka-4.1x-runtime-comparison
on:
  pull_request:
    paths:
      - ".github/workflows/m3b-kafka-version-compare.yml"
      - "deployments/docker-compose-ha.yml"
      - "deployments/docker-compose-ha-dynamic.yml"
      - "deployments/docker-compose-ha-dns-ttl-zero.yml"
      - "scripts/m3b-kraft-parallel-smoke.sh"
      - "scripts/m3b_kraft_diagnostics.py"
      - "scripts/test_m3b_kraft_diagnostics.py"
      - "scripts/m3b_network_ab_evidence.py"
      - "scripts/test_m3b_network_ab_evidence.py"
      - "scripts/m3b_kafka_version_matrix.py"
      - "scripts/test_m3b_kafka_version_matrix.py"
      - "scripts/m3b_kraft_audit.py"
      - "scripts/m3b_controller_sockets.py"
      - "scripts/m3b_expected_dynamic_failure.py"
      - "internal/kafkaha/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  kafka-version-trial:
    name: Kafka-${{ matrix.kafka.version }}-dynamic-restart-trial-${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        kafka:
          - version: "4.1.0"
            image: "apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f"
          - version: "4.1.2"
            image: "apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e"
        trial: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      M3B_NETWORK_AB_MODE: dynamic
      M3B_HA_COMPOSE_FILE: deployments/docker-compose-ha-dynamic.yml
      M3B_KAFKA_IMAGE: ${{ matrix.kafka.image }}
      M3B_KRAFT_DIAGNOSTICS_DIR: /tmp/m3b-parallel-kraft-diagnostics
      M3B_PARALLEL_REPORT_PATH: /tmp/m3b-parallel-restart-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download && go mod verify
      - name: Validate selected pinned image, runtime provenance and evidence contracts
        run: |
          docker compose -f "$M3B_HA_COMPOSE_FILE" config >/dev/null
          bash -n scripts/m3b-kraft-parallel-smoke.sh
          python3 -m unittest discover -s scripts -p 'test_m3b_kraft_diagnostics.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_network_ab_evidence.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_kafka_version_matrix.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_kraft_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_controller_sockets.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_expected_dynamic_failure.py' -v
          go test -count=1 ./internal/kafkaha
      - name: Run the unchanged dynamic two-voter restart fault
        run: bash scripts/m3b-kraft-parallel-smoke.sh
      - name: Preserve exact-head Kafka, JDK, voter, socket and recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-kafka-version-${{ matrix.kafka.version }}-trial-${{ matrix.trial }}
          path: |
            /tmp/m3b-parallel-restart-report.json
            /tmp/m3b-parallel-kraft-diagnostics/
          if-no-files-found: error
          retention-days: 14

  kafka-version-aggregate:
    if: always()
    needs: kafka-version-trial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: m3b-kafka-version-*
          path: /tmp/m3b-kafka-version-trials
          merge-multiple: false
      - name: Require at least two exposed trials per pinned Kafka version
        run: |
          python3 scripts/m3b_kafka_version_matrix.py \
            --head "$(git rev-parse HEAD)" \
            --directory /tmp/m3b-kafka-version-trials \
            --expected-trials 3 \
            --minimum-exposed 2 \
            --out /tmp/m3b-kafka-version-comparison.json
      - name: Preserve observational Kafka/JDK comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-kafka-version-comparison-summary
          path: /tmp/m3b-kafka-version-comparison.json
          if-no-files-found: warn
          retention-days: 14
