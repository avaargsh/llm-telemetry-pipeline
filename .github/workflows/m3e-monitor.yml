name: m3e-live-kafka-monitoring
on:
  pull_request:
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Real broker metadata + Prometheus rules
        run: bash scripts/m3e-monitor-smoke.sh
