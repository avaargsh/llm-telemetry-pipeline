name: m3b-kraft-fixed-vs-dynamic-network-control
on:
  pull_request:
    paths:
      - ".github/workflows/m3b-kraft-network-ab.yml"
      - "deployments/docker-compose-ha-dynamic.yml"
      - "deployments/docker-compose-ha-4.1.2.yml"
      - "deployments/docker-compose-ha-dns-ttl-zero.yml"
      - "deployments/m3b-dns-ttl-zero.security"
      - "scripts/m3b_dns_ttl_experiment.py"
      - "scripts/test_m3b_dns_ttl_experiment.py"
      - "scripts/m3b_trial_summary.py"
      - "scripts/test_m3b_trial_summary.py"
      - "internal/kafkaha/**"
      - "scripts/m3b-kraft-parallel-smoke.sh"
      - "scripts/m3b_network_ab_evidence.py"
      - "scripts/test_m3b_network_ab_evidence.py"
      - "scripts/m3b_kraft_diagnostics.py"
      - "scripts/m3b_kraft_audit.py"
      - "scripts/m3b_controller_sockets.py"
      - "scripts/m3b_expected_dynamic_failure.py"
      - "scripts/test_m3b_expected_dynamic_failure.py"
      - "scripts/m3b_dns_ttl_aggregate.py"
      - "scripts/test_m3b_dns_ttl_aggregate.py"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  network-ab:
    name: KRaft-parallel-fault-${{ matrix.profile }}-network-trial-${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        profile: [pinned, pinned-4.1.2, dynamic, dynamic-ttl-zero]
        trial: [1, 2, 3]
        include:
          - profile: pinned
            mode: pinned
            compose: deployments/docker-compose-ha.yml
            image_ref: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
          - profile: pinned-4.1.2
            mode: pinned
            compose: deployments/docker-compose-ha-4.1.2.yml
            image_ref: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
          - profile: dynamic
            mode: dynamic
            compose: deployments/docker-compose-ha-dynamic.yml
            image_ref: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
          - profile: dynamic-ttl-zero
            mode: dynamic-ttl-zero
            compose: deployments/docker-compose-ha-dns-ttl-zero.yml
            image_ref: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download && go mod verify
      - name: Validate controlled Docker profile and independent negative tests
        env:
          M3B_HA_COMPOSE_FILE: ${{ matrix.compose }}
          M3B_EXPECTED_KAFKA_IMAGE_REF: ${{ matrix.image_ref }}
        run: |
          bash -n scripts/m3b-kraft-parallel-smoke.sh
          docker compose -f "$M3B_HA_COMPOSE_FILE" config >/dev/null
          python3 -m unittest discover -s scripts -p 'test_m3b_network_ab_evidence.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_controller_sockets.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_kraft_audit.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_kraft_diagnostics.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_dns_ttl_experiment.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_trial_summary.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_expected_dynamic_failure.py' -v
          python3 -m unittest discover -s scripts -p 'test_m3b_dns_ttl_aggregate.py' -v
          go test -count=1 ./internal/kafkaha
      - name: Real parallel two-controller Kafka fault under selected network
        env:
          M3B_NETWORK_AB_MODE: ${{ matrix.mode }}
          M3B_HA_COMPOSE_FILE: ${{ matrix.compose }}
          M3B_EXPECTED_KAFKA_IMAGE_REF: ${{ matrix.image_ref }}
          M3B_KRAFT_DIAGNOSTICS_DIR: /tmp/m3b-parallel-kraft-diagnostics
          M3B_PARALLEL_REPORT_PATH: /tmp/m3b-parallel-restart-report.json
        run: bash scripts/m3b-kraft-parallel-smoke.sh
      - name: Require qualifying reassignment and recovery in TTL treatment
        if: matrix.profile == 'dynamic-ttl-zero'
        shell: bash
        run: |
          set +e
          python3 scripts/m3b_dns_ttl_experiment.py --head "$(git rev-parse HEAD)" --report /tmp/m3b-parallel-kraft-diagnostics/network-ab-comparison.json
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "::notice::UNEXPOSED_INCONCLUSIVE; this trial is not counted as mitigation evidence"
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
      - name: Preserve true Kafka ACK/ISR recovery or INCOMPLETE receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-network-ab-kafka-${{ matrix.profile }}-trial-${{ matrix.trial }}
          path: /tmp/m3b-parallel-restart-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve normalized voter/DNS audit and A/B comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-network-ab-identity-${{ matrix.profile }}-trial-${{ matrix.trial }}
          path: /tmp/m3b-parallel-kraft-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual kernel TCP peers during both-controller stop/start
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-network-ab-sockets-${{ matrix.profile }}-trial-${{ matrix.trial }}
          path: /tmp/m3b-parallel-kraft-diagnostics/controller-peers.jsonl
          if-no-files-found: warn
          retention-days: 14
  ttl-exposure-aggregate:
    if: always()
    needs: network-ab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: m3b-network-ab-identity-dynamic-ttl-zero-trial-*
          path: /tmp/m3b-ttl-trials
          merge-multiple: false
      - name: Require two independently exposed TTL recovery trials
        run: python3 scripts/m3b_dns_ttl_aggregate.py --head "$(git rev-parse HEAD)" --directory /tmp/m3b-ttl-trials --expected-trials 3 --minimum-exposed 2 --out /tmp/m3b-ttl-aggregate.json
      - name: Preserve TTL exposure aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3b-dns-ttl-exposure-aggregate
          path: /tmp/m3b-ttl-aggregate.json
          if-no-files-found: warn
          retention-days: 14
