name: m5-clickhouse-async-ack-boundary
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  clickhouse-ack-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Validate async buffer ACK semantics on real ClickHouse
        env:
          M5_ASYNC_EVIDENCE_PATH: artifacts/m5-clickhouse-async-ack.json
        run: bash scripts/m5-clickhouse-async-smoke.sh
      - name: Preserve real asynchronous insertion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-clickhouse-async-ack-evidence
          path: artifacts/m5-clickhouse-async-ack.json
          if-no-files-found: error
          retention-days: 14
