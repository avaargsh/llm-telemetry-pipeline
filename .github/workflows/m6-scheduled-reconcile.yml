name: m6-scheduled-reconciliation
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bounded-reconcile-with-real-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Prove UTC window selection, redaction and nonzero exit contract
        run: python3 -m unittest discover -s scripts -p 'test_m6_scheduled_reconcile.py' -v
      - name: Build non-root CronJob container and verify its CLI entrypoint
        run: |
          docker build -f deployments/Dockerfile.m6-scheduled \
            -t llm-telemetry-reconciler:m6-ci .
          docker run --rm --read-only --user 65532:65532 \
            llm-telemetry-reconciler:m6-ci --help
      - name: Test scheduled reconciliation against real PG and ClickHouse
        run: bash scripts/m6-reconcile-smoke.sh
      - name: Archive only sanitized M6 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-scheduled-reconciliation-evidence
          path: |
            artifacts/m6-scheduled-fail.json
            artifacts/m6-scheduled-empty.json
          if-no-files-found: error
          retention-days: 14
