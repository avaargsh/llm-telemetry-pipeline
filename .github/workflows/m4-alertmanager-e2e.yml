name: m4-live-alertmanager-delivery
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  live-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate all real alert rules
        run: |
          docker run --rm -v "$PWD/deployments/prometheus:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /rules/alert-rules.yml
          docker run --rm -v "$PWD/deployments/prometheus:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules /rules/alert-rules.test.yml
      - name: Real Kafka → exporter → Prometheus → Alertmanager → webhook firing and resolution
        env:
          M4_ALERT_REPORT_PATH: /tmp/m4-alert-delivery-report.json
        run: bash scripts/m4-alert-delivery-smoke.sh
      - name: Publish machine-checkable delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-live-alertmanager-delivery
          path: /tmp/m4-alert-delivery-report.json
          if-no-files-found: ignore
          retention-days: 14
