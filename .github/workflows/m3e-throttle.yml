name: m3e-clickhouse-backpressure
on:
  pull_request:
  workflow_dispatch:
jobs:
  throttle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Real ClickHouse ACK delay and Kafka recovery throughput
        env:
          M3E_THROTTLE_REPORT: /tmp/m3e-throttle-report.json
        run: bash scripts/m3e-throttle-smoke.sh
      - name: Preserve machine-readable backpressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3e-backpressure-report
          path: /tmp/m3e-throttle-report.json
          if-no-files-found: ignore
          retention-days: 14
