name: m1-integration-smoke
on:
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - name: Docker-backed 1000-event Kafka to ClickHouse smoke
        run: bash scripts/m1-smoke.sh
