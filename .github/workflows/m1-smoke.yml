name: m1-integration-smoke
on:
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        event_count: [1000, 100000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Docker-backed Kafka to ClickHouse ingestion
        run: bash scripts/m1-smoke.sh
        env:
          M1_COUNT: ${{ matrix.event_count }}
