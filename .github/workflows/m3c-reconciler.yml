name: m3c-ledger-clickhouse-reconciliation
on:
  pull_request:
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Real PostgreSQL + ClickHouse reconciliation matrix
        env:
          TEST_POSTGRES_DSN: postgres://telemetry:localdev-only@localhost:15432/telemetry?sslmode=disable
          TEST_CLICKHOUSE_HTTP: http://localhost:18123
        run: bash scripts/m3c-reconcile-smoke.sh
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose -f deployments/docker-compose.yml logs --tail=80 postgres clickhouse || true
          docker compose -f deployments/docker-compose.yml down -v
