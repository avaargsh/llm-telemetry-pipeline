name: m3c-ledger-clickhouse-reconciliation
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Real PostgreSQL + ClickHouse reconciliation matrix
        env:
          TEST_POSTGRES_DSN: postgres://telemetry:localdev-only@localhost:15432/telemetry?sslmode=disable
          TEST_CLICKHOUSE_HTTP: http://localhost:18123
        run: bash scripts/m3c-reconcile-smoke.sh
      - name: Preserve machine-readable reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3c-reconciliation-report
          path: /tmp/m3c-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose -f deployments/docker-compose.yml logs --tail=80 postgres clickhouse || true
          docker compose -f deployments/docker-compose.yml down -v
