name: go-unit-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact Go security baseline
        run: test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Build both deployment images with updated Go compiler
        run: |
          docker build -f deployments/Dockerfile.lag-exporter -t telemetry-lag-exporter:ci .
          docker build -f deployments/Dockerfile.m6-scheduled -t telemetry-reconciler:ci .
