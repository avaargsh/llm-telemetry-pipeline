name: go-unit-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Lockfile is generated during initial M2 dependency adoption.
      - run: go mod tidy
      - name: Print resolved lockfile for review
        run: |
          echo '===M2_GO_MOD_START==='
          cat go.mod
          echo '===M2_GO_MOD_END==='
          echo '===M2_GO_SUM_START==='
          cat go.sum
          echo '===M2_GO_SUM_END==='
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
