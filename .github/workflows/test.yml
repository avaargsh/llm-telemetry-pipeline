name: go-unit-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # TODO: Commit go.sum after the first CI fetch; authoring environment has no DNS.
      - run: go mod tidy
      - name: Export generated Go lockfile for review
        run: |
          echo '===BEGIN_GO_MOD==='
          cat go.mod
          echo '===END_GO_MOD==='
          echo '===BEGIN_GO_SUM==='
          cat go.sum
          echo '===END_GO_SUM==='
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
