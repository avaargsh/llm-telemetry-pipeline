name: go-unit-tests
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate CI queue governance policy
        run: |
          python3 -m unittest discover -s scripts -p test_ci_workflow_policy.py
          python3 scripts/ci_workflow_policy.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact Go security baseline
        run: test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Build both deployment images with updated Go compiler
        run: |
          docker build -f deployments/Dockerfile.lag-exporter -t telemetry-lag-exporter:ci .
          docker build -f deployments/Dockerfile.m6-scheduled -t telemetry-reconciler:ci .
          docker build -f deployments/Dockerfile.genai-observation-worker -t genai-observation-worker:ci .
          docker build -f deployments/Dockerfile.genai-observation-receiver -t genai-observation-receiver:ci .
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary deployments/k8s/genai-observation-receiver.yaml
