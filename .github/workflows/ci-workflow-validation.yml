name: ci-workflow-validation
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_workflows.py"
      - "scripts/test_validate_workflows.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "scripts/validate_workflows.py"
      - "scripts/test_validate_workflows.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Parse every workflow as YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/*.yml
      - name: Test workflow policy validator
        run: python3 -m unittest discover -s scripts -p 'test_validate_workflows.py' -v
      - name: Validate repository workflow policy
        run: python3 scripts/validate_workflows.py
