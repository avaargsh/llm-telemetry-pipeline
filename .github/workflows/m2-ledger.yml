name: m2-ledger-outbox-integration
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Start PostgreSQL schema
        run: docker compose -f deployments/docker-compose.yml up -d postgres
      - name: Wait until schema is available
        run: |
          for i in $(seq 1 60); do
            if docker compose -f deployments/docker-compose.yml exec -T postgres \
               psql -U telemetry -d telemetry -tAc 'SELECT count(*) FROM usage_ledger' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose -f deployments/docker-compose.yml logs postgres
          exit 1
      - name: Transactional PostgreSQL integration tests
        env:
          TEST_POSTGRES_DSN: postgres://telemetry:localdev-only@localhost:15432/telemetry?sslmode=disable
        run: go test -count=1 -v ./internal/ledger ./internal/outbox
      - name: Stop isolated test environment
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  postgres-kafka-clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Ledger persists when Kafka is down, then relay and analyze
        run: bash scripts/m2-smoke.sh
