name: m5a-authenticated-ingestion
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  postgres-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Start PostgreSQL schema
        run: docker compose -f deployments/docker-compose.yml up -d postgres
      - name: Wait until schema is available
        run: |
          for i in $(seq 1 60); do
            if docker compose -f deployments/docker-compose.yml exec -T postgres \
              psql -U telemetry -d telemetry -tAc 'SELECT count(*) FROM usage_ledger' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose -f deployments/docker-compose.yml logs postgres
          exit 1
      - name: HTTP authenticated ingestion against real PostgreSQL
        env:
          TEST_POSTGRES_DSN: postgres://telemetry:localdev-only@localhost:15432/telemetry?sslmode=disable
        run: go test -count=1 -v ./internal/ingestapi
      - name: Stop isolated test environment
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  http-kafka-outage-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: Real HTTP → PG Ledger/Outbox → Kafka → ClickHouse recovery
        run: bash scripts/m5a-http-recovery-smoke.sh
