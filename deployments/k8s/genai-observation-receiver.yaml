apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-observation-receiver
  labels:
    app.kubernetes.io/name: genai-observation-receiver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: genai-observation-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genai-observation-receiver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "4318"
        prometheus.io/scheme: https
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: llm-telemetry-pipeline/genai-observation-receiver:REPLACE_WITH_PINNED_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            - name: GENAI_OBSERVATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: genai-observation-receiver
                  key: database-url
            - name: GENAI_OBSERVATION_CREDENTIALS_FILE
              value: /etc/genai-observation/credentials.json
            - name: GENAI_OBSERVATION_LISTEN_ADDR
              value: ":4318"
            - name: GENAI_OBSERVATION_TLS_CERT_FILE
              value: /etc/genai-observation/tls/tls.crt
            - name: GENAI_OBSERVATION_TLS_KEY_FILE
              value: /etc/genai-observation/tls/tls.key
            - name: GENAI_OBSERVATION_QUEUE_CAPACITY
              value: "10000"
            - name: GENAI_OBSERVATION_MAX_CONCURRENT
              value: "8"
          volumeMounts:
            - name: credentials
              mountPath: /etc/genai-observation
              readOnly: true
            - name: tls
              mountPath: /etc/genai-observation/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: otlp-http
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: credentials
          secret:
            secretName: genai-observation-receiver-credentials
            defaultMode: 0440
        - name: tls
          secret:
            secretName: genai-observation-receiver-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: genai-observation-receiver
  labels:
    app.kubernetes.io/name: genai-observation-receiver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: genai-observation-receiver
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: genai-observation-receiver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: genai-observation-receiver
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry-senders
          podSelector:
            matchLabels:
              app.kubernetes.io/name: genai-observation-worker
      ports:
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 4318
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry-database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
