# Deliberate disposable HA experiment; separate from developer single-broker Compose.
# Three combined KRaft broker/controller nodes are for CI only.
# EXPERIMENTAL DYNAMIC-IP COUNTERFACTUAL ONLY. Initial broker IPs are dynamically allocated.
# Compare to deployments/docker-compose-ha.yml with identical Kafka version,
# quorum voter IDs, volume lifecycle, ack/readback assertions and fault script.
# This Docker bridge network can reassign broker IPs after stop/start.
name: telemetry-kafka-ha-dynamic
x-kafka-common: &kafka-common
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:9093,2@broker2:9093,3@broker3:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
  CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
services:
  ha-volume-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /b1 /b2 /b3"]
    volumes:
      - broker1_data:/b1
      - broker2_data:/b2
      - broker3_data:/b3
  broker1:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    hostname: broker1
    depends_on:
      ha-volume-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker1:19092,PLAINTEXT_HOST://127.0.0.1:39092"
    ports:
      - "127.0.0.1:39092:29092"
    volumes:
      - broker1_data:/tmp/kraft-combined-logs
  broker2:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    hostname: broker2
    depends_on:
      ha-volume-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker2:19092,PLAINTEXT_HOST://127.0.0.1:39093"
    ports:
      - "127.0.0.1:39093:29092"
    volumes:
      - broker2_data:/tmp/kraft-combined-logs
  broker3:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    hostname: broker3
    depends_on:
      ha-volume-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker3:19092,PLAINTEXT_HOST://127.0.0.1:39094"
    ports:
      - "127.0.0.1:39094:29092"
    volumes:
      - broker3_data:/tmp/kraft-combined-logs
volumes:
  broker1_data:
  broker2_data:
  broker3_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.242.0/24
