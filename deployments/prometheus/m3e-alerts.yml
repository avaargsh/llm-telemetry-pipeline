groups:
  - name: llm-telemetry-kafka-risk
    interval: 15s
    rules:
      - alert: KafkaTelemetryMonitorUnavailable
        expr: telemetry_kafka_monitor_up == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Kafka retention and lag monitor cannot verify source state
          description: Monitoring must fail closed; do not treat missing Kafka information as an empty backlog.
      - alert: KafkaTelemetryRetentionWarning
        expr: telemetry_kafka_retention_state{state="warning"} == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Kafka backlog is inside the estimated retention early-warning window
      - alert: KafkaTelemetryRetentionCritical
        expr: telemetry_kafka_retention_state{state="critical"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Estimated Kafka retention headroom is inside the safety margin
      - alert: KafkaTelemetryRetentionExpired
        expr: telemetry_kafka_retention_state{state="expiry_risk"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Oldest unconsumed Kafka record may already be beyond retention age
      - alert: KafkaTelemetryDataGap
        expr: telemetry_kafka_retention_state{state="data_gap"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Committed consumer offset is earlier than Kafka log start
