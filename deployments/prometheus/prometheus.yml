# Local dev-only M4 stack. The exporter is internal-only; localhost ports
# published by the observability compose are for CI inspection.
global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s
rule_files:
  - /etc/prometheus/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: lag-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["lag-exporter:9108"]
