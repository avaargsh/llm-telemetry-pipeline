# Disposable M11.5 integration-only Collector.
# The exporter intentionally targets the test receiver on the host network.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/drop_sampled_out:
    error_mode: ignore
    traces:
      span:
        - 'attributes["m11.sampled_out"] == "true"'
  batch:
    timeout: 100ms
    send_batch_size: 1
    send_batch_max_size: 1

exporters:
  otlphttp/durable_receiver:
    endpoint: http://127.0.0.1:4319
    encoding: json
    compression: none
    headers:
      Authorization: "Bearer m11-collector-test-token-0123456789abcdef"
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 250ms
      max_elapsed_time: 15s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/drop_sampled_out, batch]
      exporters: [otlphttp/durable_receiver]
